<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle">AL HAMZZA - أحسن الصفقات وأقوى الهمزات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261029-37">
</head>
<body data-theme="light">

    <div class="top-announcement">
        <i class="ri-fire-fill"></i>
        <span id="announcementText">تخفيضات كبرى وصلت حتى لـ 80% على أروع المنتجات! التوصيل متوفر لجميع مدن المغرب.</span>
        <div class="lang-selector">
            <button onclick="setLanguage('ar', this)" class="lang-btn active" data-lang="ar">الدارجة</button>
            <button onclick="setLanguage('fr', this)" class="lang-btn" data-lang="fr">FR</button>
            <button onclick="setLanguage('en', this)" class="lang-btn" data-lang="en">EN</button>
        </div>
    </div>

    <header class="site-header">
        <div class="container header-container">
            <a href="./index.html" class="logo-box" aria-label="العودة إلى الصفحة الرئيسية" data-i18n-aria="homeLinkAria">
                <div class="logo-main">
                    <span class="logo-percent">%</span>
                    <span class="logo-text" data-i18n="brandName">AL_HAMZZA</span>
                </div>
                <span class="logo-slogan" id="siteSlogan" data-i18n="siteSlogan">أحسن الصفقات وأقوى الهمزات بالمغرب</span>
            </a>

            <div class="search-bar-container">
                <i class="ri-search-line search-icon"></i>
                <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="قلّب على أي همزة، منتج، أو عرض..." oninput="filterProducts()">
                <button class="ai-search-btn" onclick="openAiAssistant()">
                    <i class="ri-robot-2-line"></i> <span data-i18n="aiSearchButton">مساعد AI</span>
                </button>
            </div>

            <div class="header-actions">
                <button class="theme-toggle" onclick="toggleTheme()" title="تغيير المظهر" data-i18n-title="themeToggle" data-i18n-aria="themeToggle" aria-label="تغيير المظهر">
                    <i class="ri-moon-line" id="themeIcon"></i>
                </button>
                <button class="admin-trigger-btn" onclick="openSubmissionModal()">
                    <i class="ri-add-circle-line"></i> <span data-i18n="suggestProduct">اقترح منتج</span>
                </button>
            </div>
        </div>
    </header>

    <nav class="categories-nav">
        <div class="container categories-scroll">
            <button class="cat-chip active" data-category="all" onclick="filterCategory('all', this)"><i class="ri-apps-line"></i> <span data-i18n="allDeals">جميع الهمزات</span></button>
            <button class="cat-chip" data-category="tech" onclick="filterCategory('tech', this)"><i class="ri-smartphone-line"></i> <span data-i18n="catTech">تكنولوجيا وواتساب</span></button>
            <button class="cat-chip" data-category="home" onclick="filterCategory('home', this)"><i class="ri-restaurant-line"></i> <span data-i18n="catHome">طبخ والمنزل</span></button>
            <button class="cat-chip" data-category="fashion" onclick="filterCategory('fashion', this)"><i class="ri-t-shirt-line"></i> <span data-i18n="catFashion">أناقة وموضة</span></button>
            <button class="cat-chip" data-category="jewelry" onclick="filterCategory('jewelry', this)"><i class="ri-vip-diamond-line"></i> <span data-i18n="catJewelry">مجوهرات</span></button>

            <span class="nav-divider">|</span>

            <a href="https://www.aliexpress.com" target="_blank" rel="noopener noreferrer" class="store-live-btn aliexpress"><i class="ri-shopping-bag-3-line"></i> <span data-i18n="aliexpressLive">AliExpress مباشر</span></a>
            <a href="https://www.jumia.ma" target="_blank" rel="noopener noreferrer" class="store-live-btn jumia"><i class="ri-store-2-line"></i> <span data-i18n="jumiaLive">Jumia مباشر</span></a>
            <a href="https://www.alibaba.com" target="_blank" rel="noopener noreferrer" class="store-live-btn alibaba"><i class="ri-global-line"></i> <span data-i18n="alibabaLive">Alibaba مباشر</span></a>
            <a href="https://www.temu.com" target="_blank" rel="noopener noreferrer" class="store-live-btn temu"><i class="ri-shopping-cart-2-line"></i> <span data-i18n="temuLive">Temu مباشر</span></a>
            <a href="https://www.amazon.com" target="_blank" rel="noopener noreferrer" class="store-live-btn amazon"><i class="ri-amazon-line"></i> <span data-i18n="amazonLive">Amazon مباشر</span></a>
        </div>
    </nav>

    <div class="container" id="categoryDescBox" style="display: none; margin-top: 25px;">
        <div class="category-info-card">
            <h3 id="catDescTitle"><i class="ri-information-fill"></i> <span data-i18n="categoryDetails">تفاصيل الصنف</span></h3>
            <p id="catDescText" data-i18n="categoryDescription">وصف شامل ومفصل للهمزات المتاحة فـ هذا القسم...</p>
        </div>
    </div>

    <main class="main-content container">
        <section class="products-section">
            <div id="categoryLanding">
                <div class="section-header">
                    <h2><i class="ri-apps-line"></i> <span data-i18n="categoriesHeading">تسوق حسب الصنف</span></h2>
                </div>
                <div class="category-cards-grid">
                    <button class="category-card" type="button" onclick="openCatalogCategory('fashion')">
                        <span class="category-card-icon"><i class="ri-t-shirt-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogFashion">الأزياء والملابس</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('jewelry')">
                        <span class="category-card-icon"><i class="ri-vip-diamond-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogJewelry">المجوهرات</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('accessories')">
                        <span class="category-card-icon"><i class="ri-price-tag-3-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogAccessories">الإكسسوارات</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('electronics')">
                        <span class="category-card-icon"><i class="ri-smartphone-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogElectronics">الإلكترونيات والتكنولوجيا</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('home')">
                        <span class="category-card-icon"><i class="ri-home-5-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogHome">المنزل والمطبخ</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('beauty')">
                        <span class="category-card-icon"><i class="ri-brush-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogBeauty">الجمال والعناية الشخصية</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('shoes')">
                        <span class="category-card-icon"><i class="ri-handbag-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogShoes">الأحذية والحقائب</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                    <button class="category-card" type="button" onclick="openCatalogCategory('gaming')">
                        <span class="category-card-icon"><i class="ri-gamepad-line" aria-hidden="true"></i></span>
                        <span class="category-card-title" data-i18n="catalogGaming">الألعاب والأجهزة</span>
                        <i class="ri-arrow-left-line category-card-arrow" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js?v=20261031-29"></script>
</body>
</html>
